name: Public release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BLUINK_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}

jobs:
  resources:
    if: github.event.repository.private == false && !startsWith(github.ref, 'refs/tags/v-latest-')
    name: Verify published Fonts, Typst and Web
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.9.0
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Verify npm version
        run: test "$(npm --version)" = '12.2.0'
      - name: Install pinned GitHub attestation verifier
        run: |
          mkdir -p "$RUNNER_TEMP/bluink-gh"
          curl --fail --location --retry 3 'https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz' --output "$RUNNER_TEMP/bluink-gh.tgz"
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  $RUNNER_TEMP/bluink-gh.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/bluink-gh.tgz" --strip-components=1 -C "$RUNNER_TEMP/bluink-gh"
          echo "$RUNNER_TEMP/bluink-gh/bin" >> "$GITHUB_PATH"
      - name: Download and verify published resources once
        run: node scripts/public-release.mjs resources
        timeout-minutes: 10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-resources
          path: |
            .resource-packages/*.tgz
            .resource-packages/dependencies.json
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

  native:
    if: github.event.repository.private == false
    needs: resources
    name: Build and verify ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.9.0
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Verify npm version
        run: test "$(npm --version)" = '12.2.0'
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: node scripts/public-release.mjs context --target '${{ matrix.target }}'
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shared-resources
          path: .resource-packages
      - run: node scripts/public-release.mjs resources-install
      - run: npm run build:native -- --target '${{ matrix.target }}'
        env:
          BLUINK_PUBLIC_COMMIT: ${{ github.sha }}
      - run: npm run format && git diff --exit-code
      - run: npm run lint && npm run typecheck && npm test
      - run: cargo fmt --manifest-path backend/Cargo.toml --all --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings
      - run: node scripts/public-release.mjs native-report
      - name: Prepare launcher and licence notices once
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: node scripts/public-release.mjs cli-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: cli-build
          path: .cli-build/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: |
            backend/runtime/*.node
            verification/*.json
          if-no-files-found: error
          compression-level: 0

  assemble:
    needs: [resources, native]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.9.0
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Verify npm version
        run: test "$(npm --version)" = '12.2.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shared-resources
          path: .resource-packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-build
          path: .cli-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: .
      - name: Assemble verified artifacts without compiling
        run: node scripts/public-release.mjs assemble
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-packages
          path: |
            package-out/*.tgz
            package-out/manifest.json
          if-no-files-found: error
          compression-level: 0

  smoke:
    needs: assemble
    name: Installed package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.9.0
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Verify npm version
        run: test "$(npm --version)" = '12.2.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-packages
          path: package-out
      - run: node scripts/public-release.mjs smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-results/*.json
          if-no-files-found: error

  publish:
    needs: [native, assemble, smoke]
    if: github.event_name == 'push' && github.event.repository.private == false && vars.BLUINK_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      BLUINK_PUBLISH_ENABLED: ${{ vars.BLUINK_PUBLISH_ENABLED }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.9.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Verify npm version
        run: test "$(npm --version)" = '12.2.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-packages
          path: package-out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: smoke-*
          merge-multiple: true
          path: smoke-results
      - run: node scripts/public-release.mjs verify
      - name: Install pinned GitHub attestation verifier
        run: |
          mkdir -p "$RUNNER_TEMP/bluink-gh"
          curl --fail --location --retry 3 'https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz' --output "$RUNNER_TEMP/bluink-gh.tgz"
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  $RUNNER_TEMP/bluink-gh.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/bluink-gh.tgz" --strip-components=1 -C "$RUNNER_TEMP/bluink-gh"
          echo "$RUNNER_TEMP/bluink-gh/bin" >> "$GITHUB_PATH"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            package-out/bluink-cli-*.tgz
            package-out/manifest.json
            package-out/verification.json
      - name: Verify attested workflow identity
        run: |
          for artifact in package-out/bluink-cli-*.tgz package-out/manifest.json package-out/verification.json; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/public-release.yml" --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - run: node scripts/public-release.mjs publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-verification
          path: |
            package-out/manifest.json
            package-out/verification.json
            package-out/registry-verification.json
          if-no-files-found: error

  promote_latest:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v-latest-') && github.event.repository.private == false
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.9.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Verify npm version
        run: test "$(npm --version)" = '12.2.0'
      - name: Promote current alpha only while latest is a prerelease
        run: |
          alpha="$(npm view @bluink/cli dist-tags.alpha)"
          latest="$(npm view @bluink/cli dist-tags.latest)"
          [[ "$alpha" == *-alpha ]] || { echo 'alpha tag does not point to an alpha release'; exit 1; }
          [[ "$GITHUB_REF_NAME" == "v-latest-$alpha" ]] || { echo 'promotion tag differs from the current alpha'; exit 1; }
          [[ "$latest" == *-alpha || "$latest" == *-beta || "$latest" == *-rc ]] || { echo 'latest points to a stable release'; exit 1; }
          npm dist-tag add "@bluink/cli@$alpha" latest
          for attempt in {1..12}; do
            if [[ "$(npm view @bluink/cli dist-tags.latest --prefer-online)" == "$alpha" ]]; then exit 0; fi
            sleep 5
          done
          echo 'latest tag did not propagate to npm' >&2
          exit 1
