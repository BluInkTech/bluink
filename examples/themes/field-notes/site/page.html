<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; font-src 'self' data:; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>{{ title }}</title>
  <style>{{ theme_css }}
  article > .field-note-paragraph { padding-inline-start: .75rem; border-inline-start: .1rem solid var(--publication-accent); }
  </style>
</head>
<body class="publication publication--field-notes publication--site">
  <a href="#main-content" class="skip-link">Skip to content</a>
  <nav aria-label="Chapters">{{ navigation }}</nav>
  <main id="main-content">
    <header class="publication-masthead"><span>Field notes</span><strong>{{ title }}</strong></header>
    {{ contents }}
    {{ body }}
  </main>
</body>
</html>
