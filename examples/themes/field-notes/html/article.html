<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; font-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>{{ title }}</title>
  <style>{{ theme_css }}
  </style>
</head>
<body class="publication publication--field-notes">
  <header class="publication-masthead"><span>Field notes</span><strong>{{ title }}</strong></header>
  <main id="main-content" class="publication-content">{{ body }}</main>
</body>
</html>
